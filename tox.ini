[tox]
skipsdist = True
usedevelop = True
isolated_build = True

envlist = 
    py{310,311}-django52-wagtail74-sqlite
    py{312,313,314}-django{52,60}-wagtail74-sqlite
    py314-django60-wagtail74-{postgres,mysql}

[gh-actions]
python =
    3.10: py310
    3.11: py311
    3.12: py312
    3.13: py313
    3.14: py314

[gh-actions:env]
DATABASE = 
    sqlite: sqlite
    postgres: postgres
    mysql: mysql

[testenv]
skip_install = True
commands = 
    coverage run manage.py test --deprecation all
    coverage report

deps =
    coverage

    django52: Django>=5.2,<5.3
    django60: Django>=6.0,<6.1

    wagtail74: wagtail>=7.4,<7.5

    postgres: psycopg2
    mysql: mysqlclient
